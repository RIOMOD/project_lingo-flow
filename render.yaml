services:
  - type: web
    name: project_lingo-flow
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://project-lingo-flow.vercel.app
      - key: FRONTEND_ALT_URL
        value: https://project-lingo-flow.vercel.app
      - key: JWT_ACCESS_EXPIRATION_MINUTES
        value: "30"
      - key: JWT_REFRESH_EXPIRATION_DAYS
        value: "14"
      - key: RESET_PASSWORD_EXPIRATION_MINUTES
        value: "15"
      - key: RESET_PASSWORD_URL
        value: https://project-lingo-flow.vercel.app/reset-password
      - key: AI_FALLBACK_ENABLED
        value: "true"
      - key: AI_DAILY_USAGE_LIMIT
        value: "50"
