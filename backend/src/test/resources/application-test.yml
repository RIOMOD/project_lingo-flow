spring:
  datasource:
    url: jdbc:h2:mem:lingoflow;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  mail:
    host: localhost
    port: 1025
  flyway:
    enabled: false

app:
  ai:
    model: test-model
    api-key: ""
    fallback-enabled: false
  payment:
    webhook-secret: test-webhook-secret-at-least-32-characters

debug: false

logging:
  level:
    org.springframework: INFO
