spring:
  datasource:
    url: jdbc:h2:mem:lingoflow;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  mail:
    host: localhost
    port: 1025

app:
  ai:
    model: test-model
    api-key: ""
    fallback-enabled: false
  payment:
    webhook-secret: test-webhook-secret-at-least-32-characters
