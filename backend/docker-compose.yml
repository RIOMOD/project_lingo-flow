services:
  mysql:
    image: mysql:8.0
    container_name: lingo-flow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: english_learning
    ports:
      - "3306:3306"
    volumes:
      - lingoflow-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

volumes:
  lingoflow-mysql-data:
